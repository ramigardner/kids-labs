<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🧪 KinderLab · Laboratorio de Aprendizaje</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Evita selección de texto accidental */
    }
    body {
      background: radial-gradient(circle at 30% 30%, #2a5c7e, #0d1b2a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      padding: 16px;
      touch-action: manipulation;
    }
    .game-box {
      max-width: 850px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 3px solid #f9d56e;
      border-radius: 48px;
      padding: 24px 20px 30px;
      box-shadow: 0 16px 0 #7b3f00, 0 0 0 4px #fdf0b0 inset;
    }
    h1 {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff5cf;
      text-shadow: 5px 5px 0 #3d6b5d;
      letter-spacing: 3px;
      word-break: break-word;
      margin-top: -10px;
      margin-bottom: 10px;
    }
    .canvas-area {
      background: #b1e6d1;
      border-radius: 30px;
      padding: 14px;
      border: 4px solid #ffeaa6;
      box-shadow: inset 0 0 0 6px #3f786a, 0 10px 0 #5f3f1a;
      margin-bottom: 18px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #e7fef5;
      border-radius: 20px;
      border: 3px solid #4e8d7c;
      box-shadow: inset 0 0 20px #386b5e77;
      image-rendering: crisp-edges; /* pixelado suave */
      touch-action: none;
      cursor: pointer;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 20px 30px;
      margin: 16px 0 8px;
    }
    .pet-panel {
      background: #fcf5e3;
      border-radius: 60px;
      padding: 8px 24px 8px 16px;
      border: 3px solid #e5b83c;
      box-shadow: 0 8px 0 #8b6b2d, inset 0 2px 8px white;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pet-avatar {
      font-size: 52px;
      background: #cbe6b0;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #3d8570;
      box-shadow: 0 4px 0 #1d4a3e;
    }
    .pet-stats {
      font-weight: bold;
      color: #2c523c;
    }
    .pet-name {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hp-bar {
      width: 120px;
      height: 16px;
      background: #cfb797;
      border-radius: 20px;
      border: 2px solid #4a5c2f;
      overflow: hidden;
      margin: 6px 0 2px;
    }
    .hp-fill {
      height: 100%;
      width: 80%;
      background: #e07070;
      background: linear-gradient(90deg, #df6b6b, #b14141);
    }
    .score-box {
      background: #213b4b;
      padding: 12px 28px;
      border-radius: 40px;
      border: 3px solid #f3d37c;
      box-shadow: 0 6px 0 #0e1f2a, inset 0 0 10px #98d9ff;
      color: #fef7dd;
      font-weight: bold;
      font-size: 1.6rem;
    }
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 10px 0 5px;
    }
    .btn {
      background: #f7d970;
      border: none;
      border-bottom: 6px solid #9e7128;
      font-family: inherit;
      font-weight: bold;
      font-size: 1.4rem;
      padding: 12px 26px;
      min-width: 120px;
      border-radius: 60px;
      color: #1f3f31;
      box-shadow: 0 5px 0 #6b4f1c, inset 0 2px 10px #fffde0;
      cursor: pointer;
      transition: 0.05s linear;
      touch-action: manipulation;
      text-shadow: 1px 1px 0 #fffaee;
    }
    .btn:active {
      transform: translateY(5px);
      border-bottom-width: 2px;
      box-shadow: 0 2px 0 #6b4f1c, inset 0 1px 5px #ffffdd;
    }
    .btn:disabled {
      opacity: 0.5;
      transform: none;
      pointer-events: none;
      filter: grayscale(0.5);
    }
    .hint-text {
      color: #feedc4;
      font-weight: bold;
      text-align: center;
      margin-top: 12px;
      font-size: 1rem;
      text-shadow: 2px 2px 0 #113121;
    }
  </style>
</head>
<body>
<div class="game-box">
  <h1>🧫 KINDER LAB</h1>
  <div class="canvas-area">
    <canvas id="labCanvas" width="700" height="350"></canvas>
  </div>

  <!-- Panel de mascota y puntuación -->
  <div class="dashboard">
    <div class="pet-panel">
      <div class="pet-avatar" id="petEmoji">🦊</div>
      <div class="pet-stats">
        <div class="pet-name"><span id="petName">Zippy</span> <span id="petStars">⭐⭐⭐</span></div>
        <div class="hp-bar"><div class="hp-fill" id="petHpBar" style="width:80%"></div></div>
        <span id="hpText">80%</span>
      </div>
    </div>
    <div class="score-box">
      🏆 <span id="scoreDisplay">0</span>
    </div>
  </div>

  <!-- Botones de acción -->
  <div class="action-bar">
    <button class="btn" id="playBtn">🔍 ¡Jugar!</button>
    <button class="btn" id="resetBtn">🌀 Reiniciar</button>
  </div>
  <div class="hint-text" id="messageHint">🐾 ¡Presiona Jugar y elige la respuesta correcta!</div>
</div>

<script>
  (function(){
    "use strict";

    // ---------- CONFIGURACIÓN ----------
    const canvas = document.getElementById('labCanvas');
    const ctx = canvas.getContext('2d');
    // Ajuste para pantallas pequeñas: lógica a 700x350
    canvas.width = 700;
    canvas.height = 350;

    // Estado del juego
    let gameActive = false;
    let score = 0;
    let currentQuestion = null;     // { a, b, answer, operation }
    let correctAnswer = 0;
    let options = [];              // array de números (4 opciones)
    let selectedOption = -1;       // índice seleccionado
    
    // Mascota
    let pet = {
      name: 'Zippy',
      emoji: '🦊',
      hp: 80,
      maxHp: 100,
      stars: 3
    };
    
    // Elementos UI
    const petEmojiSpan = document.getElementById('petEmoji');
    const petNameSpan = document.getElementById('petName');
    const petStarsSpan = document.getElementById('petStars');
    const petHpBar = document.getElementById('petHpBar');
    const hpText = document.getElementById('hpText');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const messageHint = document.getElementById('messageHint');

    // Botones
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ---------- ACTUALIZAR UI ----------
    function updateUI() {
      petEmojiSpan.textContent = pet.emoji;
      petNameSpan.textContent = pet.name;
      petStarsSpan.textContent = '⭐'.repeat(pet.stars) + '☆'.repeat(5 - pet.stars);
      const hpPercent = (pet.hp / pet.maxHp) * 100;
      petHpBar.style.width = hpPercent + '%';
      hpText.textContent = pet.hp + '%';
      scoreDisplay.textContent = score;
    }

    // Mostrar mensaje
    function setMessage(msg, isGood = true) {
      messageHint.textContent = msg;
      messageHint.style.color = isGood ? '#feedc4' : '#ffb0a0';
    }

    // ---------- GENERAR PREGUNTA (sumas, restas, multiplicaciones suaves) ----------
    function generateMathQuestion() {
      const type = Math.floor(Math.random() * 3); // 0:suma, 1:resta, 2:multiplicación
      let a, b, answer, operation;
      if (type === 0) { // suma
        a = Math.floor(Math.random() * 20) + 1;
        b = Math.floor(Math.random() * 15) + 1;
        answer = a + b;
        operation = '+';
      } else if (type === 1) { // resta (positiva)
        a = Math.floor(Math.random() * 20) + 5;
        b = Math.floor(Math.random() * a);
        answer = a - b;
        operation = '-';
      } else { // multiplicación (tablas hasta 5)
        a = Math.floor(Math.random() * 5) + 1;
        b = Math.floor(Math.random() * 5) + 1;
        answer = a * b;
        operation = '×';
      }
      return { a, b, answer, operation };
    }

    // Generar opciones (incluyendo la correcta)
    function generateOptions(correct, count = 4) {
      let opts = new Set();
      opts.add(correct);
      while (opts.size < count) {
        let offset = Math.floor(Math.random() * 9) - 4; // -4..4
        let candidate = correct + offset;
        if (candidate >= 0) opts.add(candidate);
      }
      let arr = Array.from(opts);
      // mezclar
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Nueva ronda
    function newRound() {
      if (!gameActive) return;
      currentQuestion = generateMathQuestion();
      correctAnswer = currentQuestion.answer;
      options = generateOptions(correctAnswer, 4);
      selectedOption = -1;
      drawCanvas();
      setMessage(`🧪 ¿Cuánto es ${currentQuestion.a} ${currentQuestion.operation} ${currentQuestion.b}?`, true);
    }

    // ---------- DIBUJAR EN CANVAS (interfaz amigable) ----------
    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Fondo con degradado
      const grad = ctx.createLinearGradient(0, 0, canvas.width*0.8, canvas.height);
      grad.addColorStop(0, '#b1e6d1');
      grad.addColorStop(1, '#daf5e7');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Borde decorativo
      ctx.strokeStyle = '#3d786a';
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width-8, canvas.height-8);
      
      // Título dentro del canvas
      ctx.font = 'bold 26px "Segoe UI", "Comic Sans MS", cursive';
      ctx.fillStyle = '#1f4d3a';
      ctx.shadowColor = '#ffeaa6';
      ctx.shadowBlur = 8;
      ctx.textAlign = 'center';
      ctx.fillText('🧪 Laboratorio de Mates', canvas.width/2, 55);
      ctx.shadowBlur = 0;
      
      if (!gameActive) {
        ctx.font = '28px sans-serif';
        ctx.fillStyle = '#3f2b1c';
        ctx.fillText('⏸️ Pulsa "¡Jugar!"', canvas.width/2, 170);
        return;
      }
      
      if (!currentQuestion) {
        newRound();
        return;
      }
      
      // Mostrar operación
      ctx.font = 'bold 42px "Courier New", monospace';
      ctx.fillStyle = '#1f3f31';
      ctx.fillText(`${currentQuestion.a} ${currentQuestion.operation} ${currentQuestion.b} = ?`, canvas.width/2, 130);
      
      // Dibujar botones de opciones (4)
      const btnW = 120, btnH = 70, startX = (canvas.width - (btnW*4 + 30*3)) / 2;
      const yPos = 200;
      
      for (let i = 0; i < options.length; i++) {
        let x = startX + i * (btnW + 30);
        let isSelected = (i === selectedOption);
        
        // fondo del botón
        ctx.fillStyle = isSelected ? '#f7d970' : '#ffe5a3';
        ctx.shadowColor = '#7a5c2e';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.roundRect(x, yPos, btnW, btnH, 20);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = '#b08d4b';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // texto
        ctx.font = 'bold 32px "Segoe UI", sans-serif';
        ctx.fillStyle = '#1f3f31';
        ctx.textAlign = 'center';
        ctx.fillText(options[i], x + btnW/2, yPos + 48);
      }
      
      // Si hay selección, mostrar botón "confirmar" virtual
      if (selectedOption !== -1) {
        ctx.font = 'bold 20px sans-serif';
        ctx.fillStyle = '#1d5730';
        ctx.fillText('✅ Toca de nuevo para confirmar', canvas.width/2, 310);
      }
    }

    // Helper roundRect
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };

    // ---------- MANEJAR SELECCIÓN (click/tap en canvas) ----------
    function handleCanvasClick(e) {
      if (!gameActive || !currentQuestion) return;
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
        e.preventDefault();
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;
      
      const btnW = 120, btnH = 70, startX = (canvas.width - (btnW*4 + 30*3)) / 2;
      const yPos = 200;
      
      for (let i = 0; i < options.length; i++) {
        let x = startX + i * (btnW + 30);
        if (canvasX >= x && canvasX <= x + btnW && canvasY >= yPos && canvasY <= yPos + btnH) {
          if (selectedOption === i) {
            // Confirmar respuesta
            evaluateAnswer(options[i]);
          } else {
            selectedOption = i;
            drawCanvas();
            setMessage(`🔎 Seleccionaste ${options[i]}. Toca de nuevo para confirmar.`, true);
          }
          return;
        }
      }
    }

    function evaluateAnswer(chosen) {
      if (chosen === correctAnswer) {
        // correcto
        score += 10;
        pet.hp = Math.min(pet.maxHp, pet.hp + 5);
        setMessage(`🎉 ¡Correcto! +10 puntos. ¡Muy bien!`, true);
        // posible estrella extra
        if (score % 50 === 0 && pet.stars < 5) pet.stars++;
      } else {
        // error
        pet.hp = Math.max(0, pet.hp - 12);
        setMessage(`❌ ¡Uy! Era ${correctAnswer}. Sigue intentando.`, false);
        if (pet.hp <= 0) {
          gameActive = false;
          setMessage(`😢 ${pet.name} se cansó. Pulsa Reiniciar.`, false);
        }
      }
      
      updateUI();
      
      if (gameActive) {
        newRound();
      } else {
        drawCanvas();
      }
    }

    // ---------- CONTROL DE JUEGO ----------
    function startGame() {
      gameActive = true;
      if (pet.hp <= 0) resetGame();
      newRound();
      updateUI();
      drawCanvas();
      setMessage('🧪 ¡A resolver! Elige la respuesta correcta.', true);
    }

    function resetGame() {
      gameActive = true;
      score = 0;
      pet = { name: 'Zippy', emoji: '🦊', hp: 80, maxHp: 100, stars: 3 };
      updateUI();
      newRound();
      drawCanvas();
      setMessage('🌟 ¡Nueva partida! Mucha suerte.', true);
    }

    // ---------- INICIALIZAR EVENTOS ----------
    function bindEvents() {
      canvas.addEventListener('click', handleCanvasClick);
      canvas.addEventListener('touchstart', handleCanvasClick, {passive: false});
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      
      playBtn.addEventListener('click', () => {
        if (!gameActive) {
          if (pet.hp <= 0) resetGame();
          else startGame();
        } else {
          // si ya está activo, nueva ronda manual
          newRound();
        }
      });
      
      resetBtn.addEventListener('click', () => {
        resetGame();
      });
    }

    // Dibujo inicial
    function initialDraw() {
      gameActive = false;
      drawCanvas();
      updateUI();
    }

    bindEvents();
    initialDraw();
  })();
</script>
</body>
</html>
